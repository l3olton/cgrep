name: test cgrep

on:
  push:
    branches: [test]

  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@master

      - name: build executable
        run: sh build.sh

      - name: test
        run: cd test && python3 test.py